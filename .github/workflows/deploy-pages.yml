name: Deploy Ganpati Invitation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare mobile-optimized website
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Babaria_Ganpati_Visarjan_2026_COMPLETE_MOBILE_FINAL*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "Website ZIP not found"; exit 1; fi
          rm -rf _site && mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          test -f _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          # Final wording cleanup for undated older family photos.
          s=s.replace(">Archive<", ">Earlier Memory<")
          s=s.replace("'Archive'", "'Earlier Memory'")
          s=s.replace('"Archive"', '"Earlier Memory"')
          # Keep the floating music control away from the gallery buttons on phones.
          css = """
          @media(max-width:760px){
            .sound{position:fixed!important;right:12px!important;bottom:14px!important;top:auto!important;z-index:90!important;max-width:none!important;padding:10px 13px!important;font-size:.82rem!important;box-shadow:0 8px 24px rgba(45,8,8,.28)}
            .gallery-actions{padding-right:0!important}
          }
          """
          s=s.replace('</style>', css+'</style>')
          p.write_text(s,encoding='utf-8')
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
