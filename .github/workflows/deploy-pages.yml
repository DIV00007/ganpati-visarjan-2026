name: Deploy Ganpati Invitation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Babaria_Ganpati_Visarjan_2026_FIXED_GitHub_v3_ShuffleFinal*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Website ZIP not found"
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          unzip -q "$ZIP_FILE" -d _site
          test -f _site/index.html
          test -d _site/assets
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
